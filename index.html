<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>e-ORB &mdash; Oil Record Book Assistant</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#eaf3fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050f1c" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="e-ORB MARINE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf3fc; --bg-2:#dbeafa; --panel:#ffffff; --panel-2:#f3f9fe; --panel-3:#e4f0fb;
  --border:#bcd8f0; --border-lo:#d3e6f7; --text:#0c2038; --text-dim:#3f6180; --text-dim-2:#5f83a3;
  --accent:#1878d6; --accent-2:#4aa4ee; --accent-dim:#d9edfc; --accent-text:#ffffff; --ok:#158a4d; --ok-dim:#dcf3e4;
  --warn:#a3690a; --warn-dim:#fbecc9; --danger:#c23b31; --danger-dim:#fbdcd8;
  --deepblue-0:#020814; --deepblue-1:#04122a; --deepblue-2:#082044; --deepblue-3:#0d2f5c;
  --auth-scrim-0:#eaf3fc; --auth-scrim-mid:rgba(234,243,252,.55); --auth-photo-opacity:.32;
  --radius:16px; --radius-sm:12px; --radius-lg:22px; --radius-pill:999px; --dur:.16s; --ease:cubic-bezier(.3,0,.2,1);
  --shadow-card:0 1px 2px rgba(16,40,60,.07), 0 10px 26px rgba(16,40,60,.08);
  --shadow-pop:0 16px 40px rgba(16,40,60,.18);
  --shadow-raised:
    inset 1px 1px 1px rgba(255,255,255,.6),
    inset -2px -2px 3px rgba(16,40,60,.08),
    0 3px 8px rgba(16,40,60,.10);
  --glow-accent:0 0 0 3px rgba(24,120,214,.18);
  --glow-accent-strong:0 0 10px rgba(24,120,214,.35), 0 0 22px rgba(24,120,214,.14);
  --glass-panel:rgba(255,255,255,.72);
  --glass-border:rgba(60,110,160,.22);
  --glass-blur:18px;
  --texture-opacity:.035;
  --font-sans:'IBM Plex Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
/* Dark alternate: used when the OS prefers dark, unless explicitly overridden with data-theme="light" */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050f1c; --bg-2:#030a14; --panel:#0d2c4a; --panel-2:#123a5f; --panel-3:#1a4a73;
    --border:#2c5578; --border-lo:#173350; --text:#eef3f8; --text-dim:#aec3d6; --text-dim-2:#89a2ba;
    --accent:#2f8ef2; --accent-2:#7cc4ff; --accent-dim:#123f66; --accent-text:#ffffff; --ok:#22c55e; --ok-dim:#173a26;
    --warn:#f59e0b; --warn-dim:#4a3a17; --danger:#ef4444; --danger-dim:#4a2320;
    --auth-scrim-0:#04122a; --auth-scrim-mid:rgba(4,18,42,.55); --auth-photo-opacity:.55;
    --shadow-card:0 1px 0 rgba(255,255,255,.05) inset, 0 8px 22px rgba(2,8,18,.5);
    --shadow-pop:0 16px 44px rgba(1,5,12,.55);
    --shadow-raised:
      inset 1px 1px 1px rgba(170,205,235,.14),
      inset -2px -2px 4px rgba(0,0,0,.45),
      0 4px 10px rgba(0,0,0,.3);
    --glow-accent:0 0 0 3px rgba(47,142,242,.22);
    --glow-accent-strong:0 0 10px rgba(47,142,242,.5), 0 0 26px rgba(47,142,242,.2);
    --glass-panel:rgba(18,45,74,.58);
    --glass-border:rgba(130,175,215,.22);
    --texture-opacity:.05;
  }
  :root:not([data-theme="light"]) body{background:radial-gradient(ellipse 900px 520px at 50% -12%, var(--deepblue-3) 0%, var(--deepblue-1) 55%, var(--bg) 100%) fixed;}
}
:root[data-theme="dark"]{
  --bg:#050f1c; --bg-2:#030a14; --panel:#0d2c4a; --panel-2:#123a5f; --panel-3:#1a4a73;
  --border:#2c5578; --border-lo:#173350; --text:#eef3f8; --text-dim:#aec3d6; --text-dim-2:#89a2ba;
  --accent:#2f8ef2; --accent-2:#7cc4ff; --accent-dim:#123f66; --accent-text:#ffffff; --ok:#22c55e; --ok-dim:#173a26;
  --warn:#f59e0b; --warn-dim:#4a3a17; --danger:#ef4444; --danger-dim:#4a2320;
  --auth-scrim-0:#04122a; --auth-scrim-mid:rgba(4,18,42,.55); --auth-photo-opacity:.55;
  --shadow-card:0 1px 0 rgba(255,255,255,.05) inset, 0 8px 22px rgba(2,8,18,.5);
  --shadow-pop:0 16px 44px rgba(1,5,12,.55);
  --shadow-raised:
    inset 1px 1px 1px rgba(170,205,235,.14),
    inset -2px -2px 4px rgba(0,0,0,.45),
    0 4px 10px rgba(0,0,0,.3);
  --glow-accent:0 0 0 3px rgba(47,142,242,.22);
  --glow-accent-strong:0 0 10px rgba(47,142,242,.5), 0 0 26px rgba(47,142,242,.2);
  --glass-panel:rgba(18,45,74,.58);
  --glass-border:rgba(130,175,215,.22);
  --texture-opacity:.05;
}
:root[data-theme="dark"] body{background:radial-gradient(ellipse 900px 520px at 50% -12%, var(--deepblue-3) 0%, var(--deepblue-1) 55%, var(--bg) 100%) fixed;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;min-height:100vh;touch-action:manipulation;line-height:1.45;position:relative;}
/* ---- faint technical/engineering background texture, theme-aware, never reduces readability ---- */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--texture-opacity);
  background-image:
    radial-gradient(circle at 78% 12%, var(--accent) 0 1px, transparent 2px),
    radial-gradient(circle at 18% 68%, var(--accent) 0 1px, transparent 2px),
    radial-gradient(circle at 60% 85%, var(--accent) 0 1px, transparent 2px),
    repeating-radial-gradient(circle at 85% 8%, transparent 0 34px, var(--border) 34px 35px, transparent 35px 70px),
    repeating-linear-gradient(90deg, transparent 0 59px, var(--border) 59px 60px);
  background-size:140px 140px, 160px 160px, 180px 180px, 420px 420px, 60px 60px;
  background-repeat:repeat;
}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:transparent;position:relative;z-index:1;}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;}
input,select,textarea{font-family:inherit;touch-action:manipulation;}
input,select,textarea{background:var(--panel);color:var(--text);}
a{color:var(--accent);}
::selection{background:var(--accent);color:var(--accent-text);}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.card{box-shadow:var(--shadow-card);}

/* ---- Intro + sign-in background: theme-aware (light-blue by default, deep navy in dark mode) ---- */
.auth-bg{
  position:relative;min-height:100vh;overflow:hidden;
  background:
    radial-gradient(ellipse 900px 560px at 50% -8%, var(--panel-3) 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
}
.auth-bg::before{
  /* real ship-at-sea photo, subdued so foreground content stays the focus and contrast holds */
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:url("icons/bg-ship.jpg");
  background-repeat:no-repeat;background-position:center 30%;background-size:cover;
  opacity:var(--auth-photo-opacity);
}
.auth-bg::after{
  /* legibility scrim: matches the active theme so text/icon contrast is always correct */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, var(--auth-scrim-0) 0%, var(--auth-scrim-mid) 30%, var(--auth-scrim-mid) 60%, var(--auth-scrim-0) 100%);
}
.auth-bg > *{position:relative;z-index:1;}


/* ---- Intro/splash screen: full-bleed 9:16 hero photo, fit to screen ---- */
.intro-bg{position:relative;min-height:100vh;overflow:hidden;background:#04101f;}
.intro-bg::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:url("icons/intro-bg.jpg");
  background-repeat:no-repeat;background-position:center center;background-size:cover;
}
.intro-bg::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(3,12,24,.40) 0%, rgba(3,12,24,.22) 42%, rgba(3,12,24,.62) 100%);
}
.intro-bg > *{position:relative;z-index:1;}

.splash-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
.splash-icon{width:112px;height:112px;border-radius:26px;box-shadow:0 0 0 rgba(47,142,242,0);animation:splashIconIn 1.1s cubic-bezier(.2,.8,.2,1) both, splashGlow 1.8s ease-in-out .4s infinite;}
.splash-name{font-family:var(--font-mono);font-weight:700;font-size:22px;letter-spacing:.03em;color:#fff;margin-top:18px;opacity:0;text-shadow:0 2px 12px rgba(0,0,0,.65);animation:splashTextIn .7s ease-out .5s forwards;}
.splash-sub{font-size:12px;color:#d7e6f7;margin-top:6px;letter-spacing:.05em;opacity:0;text-shadow:0 1px 8px rgba(0,0,0,.65);animation:splashTextIn .7s ease-out .8s forwards;}
.splash-byline{font-size:11px;color:#b9cde3;margin-top:14px;opacity:0;text-shadow:0 1px 8px rgba(0,0,0,.65);animation:splashTextIn .7s ease-out 1.05s forwards;}
@keyframes splashIconIn{0%{opacity:0;transform:scale(.72) translateY(10px);}60%{opacity:1;}100%{opacity:1;transform:scale(1) translateY(0);}}
@keyframes splashGlow{0%,100%{box-shadow:0 0 18px 2px rgba(47,142,242,.25);}50%{box-shadow:0 0 34px 8px rgba(124,196,255,.4);}}
@keyframes splashTextIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion: reduce){.splash-icon,.splash-name,.splash-sub{animation:none !important;opacity:1;}}

/* ---- Top app bar: glass panel, floats just above the content with a soft seam ---- */
.topbar{
  background:var(--glass-panel);
  backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur));
  border-bottom:1px solid var(--glass-border);
  box-shadow:0 1px 0 rgba(47,142,242,.22), 0 8px 20px rgba(2,10,20,.12);
  padding:12px 16px 10px;padding-top:max(12px, env(safe-area-inset-top));position:sticky;top:0;z-index:40;
}
.topbar-row1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.topbar-row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;}
.brand{font-family:var(--font-mono);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--accent);text-shadow:0 0 14px rgba(47,142,242,.35);}
.brand small{color:var(--text-dim-2);font-weight:400;font-size:11px;margin-left:6px;}
.brand small.brand-sub{display:block;margin:2px 0 0 0;font-size:10.5px;line-height:1.25;letter-spacing:0;}
.timesel{display:flex;align-items:center;gap:8px;}
.timesel select{flex:1;min-width:0;}
.dtsel{display:flex;flex-direction:column;gap:8px;}
tr.a-bad td{background:rgba(239,68,68,.16);}
tr.a-bad td:first-child{box-shadow:inset 4px 0 0 var(--danger);}
tr.a-warn td{background:rgba(245,158,11,.14);}
tr.a-warn td:first-child{box-shadow:inset 4px 0 0 var(--warn);}
tr.a-ok td{background:rgba(34,197,94,.10);}
tr.a-ok td:first-child{box-shadow:inset 4px 0 0 var(--ok);}
.af{font-size:12px;line-height:1.45;margin:2px 0;}
.af-err{color:var(--danger);font-weight:600;}
.af-warn{color:var(--warn);}
.af-info{color:var(--text-dim-2);font-style:italic;}
.af-ok{color:var(--ok);font-weight:600;}
.assess-card{border-color:var(--accent);}
.assess-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.assess-sum div{border:1px solid var(--border);border-radius:var(--radius);padding:8px 4px;text-align:center;font-size:11px;color:var(--text-dim);background:var(--panel-2);}
.assess-sum b{display:block;font-size:26px;font-family:var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.assess-sum .s-bad b{color:var(--danger);} .assess-sum .s-rev b{color:var(--warn);} .assess-sum .s-ok b{color:var(--ok);}
.assess-badge{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.03em;padding:2px 7px;border-radius:2px;background:var(--warn-dim);color:var(--warn);border:1px solid var(--warn);font-weight:700;}
.timesel .colon{font-family:var(--font-mono);font-weight:700;color:var(--text-dim);}
.dlg-back{position:fixed;inset:0;background:rgba(2,7,14,.66);backdrop-filter:blur(3px);z-index:300;display:flex;align-items:center;justify-content:center;padding:18px;animation:dlgFade var(--dur) var(--ease);}
.dlg{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:420px;width:100%;padding:20px;box-shadow:var(--shadow-pop);animation:dlgPop .18s var(--ease);}
@keyframes dlgFade{from{opacity:0}to{opacity:1}}
@keyframes dlgPop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.dlg h3{margin:0 0 6px;font-size:17px;color:var(--text);}
.dlg .dlg-sub{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;line-height:1.45;}
.dlg label.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 10px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;background:var(--panel-2);color:var(--text);font-size:14px;cursor:pointer;transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);}
.dlg label.opt input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent);}
.dlg label.opt small{display:block;color:var(--text-dim);font-size:11.5px;margin-top:2px;}
.dlg label.opt.all{border-color:var(--accent);}
.dlg .dlg-btns{display:flex;gap:10px;margin-top:14px;}
.dlg .dlg-btns .btn{flex:1;}
.vessel-strip{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vessel-strip b{color:var(--text);font-weight:600;}

main{flex:1;padding:16px 16px 100px;overflow-y:auto;}
h1.pagetitle{font-family:var(--font-mono);font-size:13px;letter-spacing:.06em;color:var(--text-dim);margin:2px 0 16px;padding-bottom:10px;border-bottom:1px solid var(--border);}
h2.section-h{font-size:11.5px;font-weight:700;color:var(--accent);font-family:var(--font-mono);letter-spacing:.07em;text-transform:uppercase;margin:22px 0 10px;}

/* ---- Cards: layered glass surface with a soft highlight seam, not a flat tile ---- */
.card{
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), transparent 40%),
    var(--glass-panel);
  backdrop-filter:blur(calc(var(--glass-blur) * .7)); -webkit-backdrop-filter:blur(calc(var(--glass-blur) * .7));
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  padding:18px;margin-bottom:14px;
  box-shadow:var(--shadow-card);
  transition:border-color var(--dur) var(--ease);
}
.notice{border:1px solid var(--accent-dim);background:var(--panel-2);border-left:3px solid var(--accent);padding:10px 12px;font-size:12.5px;color:var(--text-dim);border-radius:2px;line-height:1.5;margin-bottom:12px;}
.notice.req{border-color:var(--warn);border-left-color:var(--warn);color:var(--warn);}
.notice.optn{border-color:var(--ok);border-left-color:var(--ok);color:var(--ok);}

/* ---- Buttons: slightly raised metallic surface, pressed/focus feedback ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(180deg,var(--panel-3),var(--panel-2));
  color:var(--text);border:1px solid var(--border);padding:12px 16px;border-radius:var(--radius);
  font-size:14px;font-weight:600;min-height:46px;
  box-shadow:var(--shadow-raised);
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease),filter var(--dur) var(--ease);
}
.btn:active{transform:translateY(1px) scale(.99);box-shadow:inset 1px 1px 2px rgba(0,0,0,.18);filter:brightness(.97);}
.btn:focus-visible{box-shadow:var(--glow-accent);}
.btn-primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));border-color:var(--accent);color:var(--accent-text);box-shadow:0 2px 0 rgba(1,5,12,.2), var(--glow-accent-strong);}
.btn-primary:active{box-shadow:inset 1px 1px 3px rgba(0,0,0,.3);}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text-dim);box-shadow:none;}
.btn-danger{background:var(--danger-dim);border-color:var(--danger);color:var(--danger);}
.btn:disabled,.btn[disabled]{opacity:.5;filter:saturate(.6);cursor:default;}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;min-height:36px;font-size:12.5px;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;}

label.field-label{display:block;font-size:11.5px;color:var(--text-dim);margin:0 0 6px;font-family:var(--font-mono);letter-spacing:.03em;}
.field{margin-bottom:16px;}
.field-req::after{content:" *";color:var(--danger);}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--bg-2);border:1px solid var(--border);color:var(--text);
  padding:13px 12px;border-radius:var(--radius-sm);font-size:15px;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
}
:root[data-theme="light"] input,:root[data-theme="light"] select,:root[data-theme="light"] textarea{background:#fff;}
textarea{resize:vertical;min-height:60px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow-accent);}
.hint{font-size:11px;color:var(--text-dim-2);margin-top:5px;line-height:1.45;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* ---- Segmented controls: recessed track, raised selected segment ---- */
.seg{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--bg-2);box-shadow:inset 0 1px 3px rgba(2,10,20,.18);padding:3px;gap:3px;}
.seg button{flex:1;background:transparent;color:var(--text-dim);border:none;padding:10px 4px;font-size:12.5px;font-weight:600;border-radius:calc(var(--radius) - 4px);transition:background var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.seg button.active{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--accent-text);box-shadow:0 2px 6px rgba(2,10,20,.25), 0 0 10px rgba(47,142,242,.25);}
.seg button:active{transform:scale(.98);}

.chiprow{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);border-radius:var(--radius-pill);padding:7px 14px;font-size:12.5px;font-weight:600;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.chip.active{background:linear-gradient(180deg,var(--accent-2),var(--accent));border-color:var(--accent);color:var(--accent-text);box-shadow:0 0 10px rgba(47,142,242,.3);}

/* ---- ORB register table (MEPC tabulated format) ---- */
.orbwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}
table.orb{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px;}
table.orb th{background:var(--panel-3);color:var(--text-dim);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);box-shadow:0 1px 0 var(--accent);position:sticky;top:0;}
table.orb td{padding:7px 8px;border-bottom:1px solid var(--border-lo);vertical-align:top;}
table.orb tr.entry-first td{border-top:2px solid var(--border);}
.orb .c-date{white-space:nowrap;font-family:var(--font-mono);color:var(--text-dim);width:100px;font-variant-numeric:tabular-nums;}
.orb .c-code{font-family:var(--font-mono);font-weight:700;color:var(--accent);text-align:center;width:38px;}
.orb .c-item{font-family:var(--font-mono);color:var(--text-dim);width:52px;}
.orb .c-rec{color:var(--text);line-height:1.45;}
.orb .sig{color:var(--text-dim-2);font-style:italic;margin-top:4px;}
.orb .delrow{margin-top:6px;}

.list-row{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:13px;margin-bottom:8px;box-shadow:var(--shadow-card);transition:border-color var(--dur) var(--ease),transform var(--dur) var(--ease);}
.list-row:active{transform:scale(.995);}

/* ---- Bottom navigation: fixed glass bar, floating active indicator ---- */
.bottomnav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;
  background:var(--glass-panel);
  backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur));
  border-top:1px solid var(--glass-border);
  box-shadow:0 -8px 24px rgba(2,10,20,.14);
  display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom);
  border-top-left-radius:var(--radius-lg);border-top-right-radius:var(--radius-lg);
}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 9px;background:none;border:none;border-top:2px solid transparent;color:var(--text-dim-2);font-size:10.5px;font-weight:600;letter-spacing:.02em;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease);}
.navbtn .ic{font-size:19px;line-height:1;}
.navbtn.active{color:var(--accent);border-top-color:var(--accent);}
.navbtn.active .ico-wrap{filter:drop-shadow(0 0 5px rgba(47,142,242,.6));}
.navbtn:active{transform:scale(.95);}

.navbtn-fab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:0 2px 9px;background:none;border:none;border-top:2px solid transparent;color:var(--text-dim-2);font-size:10.5px;font-weight:700;letter-spacing:.02em;transition:color var(--dur) var(--ease);}
.navbtn-fab .fab-circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:-24px;background:linear-gradient(150deg,var(--accent-2),var(--accent));box-shadow:0 6px 18px rgba(47,142,242,.5),0 0 0 4px var(--glass-panel);transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.navbtn-fab .fab-circle .ico-wrap{width:26px;height:26px;color:var(--accent-text);}
.navbtn-fab.active{color:var(--accent);}
.navbtn-fab.active .fab-circle{box-shadow:0 8px 22px rgba(47,142,242,.65),0 0 0 4px var(--glass-panel);}
.navbtn-fab:active .fab-circle{transform:scale(.92);}

.badge{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.03em;padding:2px 7px;border-radius:2px;}
.badge-req{background:var(--warn-dim);color:var(--warn);border:1px solid var(--warn);}
.badge-optn{background:var(--ok-dim);color:var(--ok);border:1px solid var(--ok);}
.badge-none{background:var(--panel-3);color:var(--text-dim);border:1px solid var(--border);}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--panel-3);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:var(--radius-pill);font-size:12.5px;z-index:200;max-width:88%;text-align:center;box-shadow:var(--shadow-pop);animation:toastIn .18s var(--ease);}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

.ico-wrap svg{width:100%;height:100%;display:block;}
h1.pagetitle{display:flex;align-items:center;gap:8px;}
h1.pagetitle .ico-wrap{color:var(--accent);}
.navbtn .ico-wrap{width:21px;height:21px;margin:0 auto;}
.brand .ico-wrap{width:17px;height:17px;color:var(--accent);vertical-align:-3px;margin-right:2px;}
.btn .ico-wrap{width:15px;height:15px;flex-shrink:0;}

/* ---- tank volume bar graph ---- */
.tankbar-row{margin-bottom:12px;}
.tankbar-hd{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:4px;}
.tankbar-hd .tn{color:var(--text);font-weight:600;}
.tankbar-hd .tv{font-family:var(--font-mono);color:var(--text);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.tankbar-track{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;height:14px;overflow:hidden;position:relative;box-shadow:inset 0 1px 3px rgba(2,10,20,.2);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 10%);}
.tankbar-fill{height:100%;border-radius:9px 0 0 9px;transition:width .3s var(--ease);}
.tankbar-fill.ok{background:var(--ok);box-shadow:0 0 8px rgba(34,197,94,.35);}
.tankbar-fill.warn{background:var(--warn);box-shadow:0 0 8px rgba(245,158,11,.35);}
.tankbar-fill.danger{background:var(--danger);box-shadow:0 0 8px rgba(239,68,68,.4);}
.tankbar-row.live{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px 9px;}
.tankbar-row.live .tankbar-track{background:var(--bg);}

/* ---- signature pad ---- */
.sigpad-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;touch-action:none;position:relative;}
.sigpad-wrap canvas{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair;}
.sigpad-placeholder{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:12.5px;font-style:italic;pointer-events:none;}
.sigpad-toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}

/* ---- signatory screen ---- */
.sig-item{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:13px;margin-bottom:8px;box-shadow:var(--shadow-card);}
.sig-item.pending{border-left:3px solid var(--warn);}
.sig-item.done{border-left:3px solid var(--ok);}
.sig-status{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.03em;padding:2px 7px;border-radius:2px;}
.sig-status.pending{background:var(--warn-dim);color:var(--warn);border:1px solid var(--warn);}
.sig-status.done{background:var(--ok-dim);color:var(--ok);border:1px solid var(--ok);}
.sig-canvas{width:100%;height:34px;color:var(--accent);}

/* ---- prohibited-transfer notice ---- */
.notice.danger{border-color:var(--danger);border-left-color:var(--danger);color:var(--danger);background:var(--danger-dim);}

/* ---- quantity-before source toggle ---- */
.qty-src-toggle{margin-bottom:8px;}

      dxU32(fr.crc), dxU32(fr.size), dxU32(fr.size),
      dxU16(fr.nameBytes.length), dxU16(0), dxU16(0), dxU16(0), dxU16(0),
      dxU32(0), dxU32(fr.offset),
      fr.nameBytes
    ]);
    centralParts.push(centralHeader);
    offset += centralHeader.length;
  });
  var centralSize = offset - centralStart;
  var eocd = dxConcat([
    dxU32(0x06054b50), dxU16(0), dxU16(0),
    dxU16(fileRecords.length), dxU16(fileRecords.length),
    dxU32(centralSize), dxU32(centralStart),
    dxU16(0)
  ]);
  return dxConcat(localParts.concat(centralParts).concat([eocd]));
}
function escXml(s){
  return String(s===undefined||s===null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c];
  });
}
function runXml(text, opts){
  opts=opts||{};
  var rpr="";
  if(opts.bold||opts.size||opts.color||opts.italic){
    rpr="<w:rPr>"+(opts.bold?"<w:b/>":"")+(opts.italic?"<w:i/>":"")+(opts.color?'<w:color w:val="'+opts.color+'"/>':"")+(opts.size?'<w:sz w:val="'+opts.size+'"/>':"")+"</w:rPr>";
  }
  var lines=String(text===undefined||text===null?"":text).split("\n");
  return lines.map(function(line,idx){
    return "<w:r>"+rpr+"<w:t xml:space=\"preserve\">"+escXml(line)+"</w:t></w:r>"+(idx<lines.length-1?"<w:br/>":"");
  }).join("");
}
function paraXml(text, opts){
  opts=opts||{};
  var ppr = opts.spacingAfter!==undefined ? '<w:pPr><w:spacing w:after="'+opts.spacingAfter+'"/></w:pPr>' : "";
  return "<w:p>"+ppr+runXml(text,opts)+"</w:p>";
}
function tableXml(headerRow, rows, widths){
  var totalW = widths.reduce(function(a,b){return a+b;},0);
  var grid = widths.map(function(w){ return '<w:gridCol w:w="'+w+'"/>'; }).join("");
  function cellXml(text, w, header){
    return '<w:tc><w:tcPr><w:tcW w:w="'+w+'" w:type="dxa"/>'+(header?'<w:shd w:val="clear" w:fill="D9E2F3"/>':'')+'</w:tcPr>'+paraXml(text,{bold:!!header, size:18})+'</w:tc>';
  }
  var headerXml = '<w:tr>'+headerRow.map(function(h,i){ return cellXml(h,widths[i],true); }).join("")+'</w:tr>';
  var bodyXml = rows.map(function(r){
    return '<w:tr>'+r.map(function(c,i){ return cellXml(c,widths[i],false); }).join("")+'</w:tr>';
  }).join("");
  return '<w:tbl><w:tblPr><w:tblW w:w="'+totalW+'" w:type="dxa"/><w:tblBorders>'+
    ['top','left','bottom','right','insideH','insideV'].map(function(b){return '<w:'+b+' w:val="single" w:sz="4" w:space="0" w:color="999999"/>';}).join("")+
    '</w:tblBorders></w:tblPr><w:tblGrid>'+grid+'</w:tblGrid>'+headerXml+bodyXml+'</w:tbl>';
}
function buildDocumentXml(blocks){
  var body = blocks.map(function(b){
    if(b.type==="h1") return paraXml(b.text,{bold:true,size:32,spacingAfter:160});
    if(b.type==="h2") return paraXml(b.text,{bold:true,size:26,spacingAfter:120});
    if(b.type==="p") return paraXml(b.text,{bold:b.bold,italic:b.italic,color:b.color,size:b.size||22,spacingAfter:120});
    if(b.type==="table") return tableXml(b.header,b.rows,b.widths)+paraXml("",{spacingAfter:80});
    return "";
  }).join("");
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
    '<w:body>'+body+
    '<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr>'+
    '</w:body></w:document>';
}
function buildDocxBytes(blocks){
  var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
    '</Types>';
  var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'+
    '</Relationships>';
  var documentXml = buildDocumentXml(blocks);
  var files=[
    {name:"[Content_Types].xml", data:contentTypes},
    {name:"_rels/.rels", data:rels},
    {name:"word/document.xml", data:documentXml}
  ];
  return makeZip(files);
}

/* ============================================================
   LICENSING — lifetime license key + single-device activation
   Disabled by default (LICENSE_CONFIG.enabled=false) so the app
   keeps working exactly as before until you deploy the backend
   (see /license-backend) and flip this on.

   Flow:
     stored activation token? --verify w/ server--> app
     no token / verify failed --> activation screen --> app

   Notes on what this can and can't guarantee:
   - "Device identifier" here is a browser fingerprint (canvas +
     UA + screen + timezone + WebGL renderer, hashed). It is NOT
     a hardware ID — a PWA has no access to one. It deters casual
     sharing; it will not stop someone determined to clear site
     data and re-activate as a "new" device.
   - Verification is best-effort offline: if the device is offline
     it keeps working on the last successful verification (see
     LICENSE_CONFIG.offlineGraceDays) rather than locking a user
     out at sea with no signal, then re-checks when back online.
   ============================================================ */
var LICENSE_CONFIG = {
  enabled: true,                               // licensing is ON: the app asks for a license code before it opens
  apiBase: "https://eorb-license-backend.onrender.com",
  offlineGraceDays: 365,                       // keep working this long without a fresh online check
  activateTimeoutMs: 60000                     // Render's free plan sleeps when idle; the first request can take up to a minute
};
function licenseApiBase(){ return String(LICENSE_CONFIG.apiBase||"").trim().replace(/\/+$/,""); }
function licenseApiConfigured(){ return /^https?:\/\/[^\s]+$/i.test(licenseApiBase()) && licenseApiBase().indexOf("PASTE-YOUR")<0; }
var LICENSE_DB_NAME = "eorb_license_db", LICENSE_STORE = "kv";
function licenseDB(){
  return new Promise(function(resolve,reject){
    var req = indexedDB.open(LICENSE_DB_NAME, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(LICENSE_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function licenseGet(key){
  return licenseDB().then(function(db){
    return new Promise(function(resolve,reject){
      var tx=db.transaction(LICENSE_STORE,"readonly").objectStore(LICENSE_STORE).get(key);
      tx.onsuccess=function(){ resolve(tx.result===undefined?null:tx.result); };
      tx.onerror=function(){ reject(tx.error); };
    });
  }).catch(function(){ return null; });
}
function licenseSet(key,val){
  return licenseDB().then(function(db){
    return new Promise(function(resolve,reject){
      var tx=db.transaction(LICENSE_STORE,"readwrite").objectStore(LICENSE_STORE).put(val,key);
      tx.onsuccess=function(){ resolve(true); };
      tx.onerror=function(){ reject(tx.error); };
    });
  }).catch(function(){ return false; });
}
function licenseDel(key){
  return licenseDB().then(function(db){
    return new Promise(function(resolve){
      var tx=db.transaction(LICENSE_STORE,"readwrite").objectStore(LICENSE_STORE)["delete"](key);
      tx.onsuccess=function(){ resolve(true); };
      tx.onerror=function(){ resolve(false); };
    });
  }).catch(function(){ return false; });
}

function sha256Hex(str){
  var enc=new TextEncoder().encode(str);
  return crypto.subtle.digest("SHA-256",enc).then(function(buf){
    var bytes=Array.from(new Uint8Array(buf));
    return bytes.map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  });
}
function canvasFingerprint(){
  try{
    var c=document.createElement("canvas"); c.width=220; c.height=40;
    var ctx=c.getContext("2d");
    ctx.textBaseline="top"; ctx.font="14px 'Arial'";
    ctx.fillStyle="#f60"; ctx.fillRect(0,0,60,20);
    ctx.fillStyle="#069"; ctx.fillText("e-ORB device check",2,2);
    return c.toDataURL();
  }catch(e){ return "no-canvas"; }
}
function webglRenderer(){
  try{
    var c=document.createElement("canvas");
    var gl=c.getContext("webgl")||c.getContext("experimental-webgl");
    if(!gl) return "no-webgl";
    var dbg=gl.getExtension("WEBGL_debug_renderer_info");
    return dbg? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "webgl-no-debug-ext";
  }catch(e){ return "no-webgl"; }
}
function computeDeviceFingerprint(){
  var raw=[
    navigator.userAgent||"",
    navigator.language||"",
    screen.width+"x"+screen.height+"x"+(screen.colorDepth||""),
    Intl.DateTimeFormat().resolvedOptions().timeZone||"",
    String(navigator.hardwareConcurrency||""),
    webglRenderer(),
    canvasFingerprint()
  ].join("||");
  return sha256Hex(raw);
}

var LICENSE = { screen:"checking", error:"", activateVals:{}, busy:false };

function licenseFetch(path, body, timeoutMs){
  if(!licenseApiConfigured()) return Promise.reject(new Error("license-server-not-set"));
  var ctrl = ("AbortController" in window) ? new AbortController() : null;
  var t = ctrl ? setTimeout(function(){ ctrl.abort(); }, timeoutMs||12000) : null;
  return fetch(licenseApiBase()+path, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body),
    signal: ctrl? ctrl.signal : undefined
  }).then(function(res){
    if(t) clearTimeout(t);
    return res.json().then(function(data){ return { ok:res.ok, status:res.status, data:data }; });
  }).finally(function(){ if(t) clearTimeout(t); });
}

function bootApp(){
  if(!STATE.auth || !STATE.auth.name){ UI.screen="login"; }
  else if(STATE.auth.pin){ UI.screen="lock"; }
  else { UI.screen="app"; }
  if(UI.screen==="app" && !STATE.hasSeenTour){
    UI.tourStep=1;
    STATE.hasSeenTour=true;
    saveState();
  }
  render();
}

function showActivateScreen(err){
  LICENSE.screen="activate";
  LICENSE.error=err||"";
  UI.screen="license";
  render();
}

function checkLicenseAndBoot(){
  if(!LICENSE_CONFIG.enabled){ bootApp(); return; }
  UI.screen="license"; LICENSE.screen="checking"; render();

  licenseGet("activation").then(function(rec){
    if(!rec || !rec.token){ showActivateScreen(); return; }

    if(!navigator.onLine){
      var ageDays=(Date.now()-(rec.lastVerified||0))/86400000;
      if(ageDays <= LICENSE_CONFIG.offlineGraceDays){ bootApp(); return; }
      showActivateScreen("You're offline and this device hasn't checked in for a while. Connect to the internet once to re-verify.");
      return;
    }

    computeDeviceFingerprint().then(function(fp){
      return licenseFetch("/api/verify", { token:rec.token, deviceHash:fp });
    }).then(function(res){
      if(res.ok && res.data && res.data.valid){
        rec.lastVerified=Date.now();
        licenseSet("activation", rec).then(bootApp);
      } else {
        licenseDel("activation").then(function(){
          showActivateScreen((res.data&&res.data.message)||"This license is no longer valid on this device.");
        });
      }
    }).catch(function(){
      // network hiccup, not a hard denial — fall back to grace period
      var ageDays=(Date.now()-(rec.lastVerified||0))/86400000;
      if(ageDays <= LICENSE_CONFIG.offlineGraceDays){ bootApp(); }
      else { showActivateScreen("Couldn't reach the license server. Check your connection and try again."); }
    });
  });
}

function renderLicenseScreen(){
  if(LICENSE.screen==="checking"){

  }

    '<div style="text-align:center;margin-bottom:22px;">'+
      '<div style="color:var(--accent);">'+icon("lock",40)+'</div>'+
      '<div class="brand" style="font-size:19px;margin-top:6px;">Activate e-ORB Marine</div>'+
      '<div class="hint" style="margin-top:2px;">Enter the license code you received from the seller</div>'+
    '</div>'+

    '<div class="card">'+
      '<div class="field"><label class="field-label field-req">License code</label><input type="text" id="licKeyInput" value="'+esc(av.key||"")+'" placeholder="EORB-XXXX-XXXX" style="font-family:var(--font-mono);letter-spacing:.04em;text-transform:uppercase;"></div>'+
      '<button class="btn btn-primary btn-block" id="licActivateBtn" '+(LICENSE.busy?"disabled":"")+'>'+(LICENSE.busy?"Activating\u2026":"Activate this device")+'</button>'+
      (LICENSE.busy? '<div class="hint" style="margin-top:8px;text-align:center;">Contacting the license server \u2014 the first time can take up to a minute. Please keep this screen open.</div>' : '')+
    '</div>'+
    '<div class="notice">This binds your license to this device/browser. Each license activates on one device at a time \u2014 contact support if you need to move it to a new device.</div>'+
  '</div>';
}
function bindLicenseScreen(){
  if(LICENSE.screen==="checking") return;
  var input=document.getElementById("licKeyInput");
  if(input) input.addEventListener("input", function(){ LICENSE.activateVals.key=this.value; });
  var btn=document.getElementById("licActivateBtn");
  if(btn) btn.onclick=function(){
    var key=(document.getElementById("licKeyInput").value||"").replace(/\s+/g,"").toUpperCase();
    if(!key){ alert("Enter your license code."); return; }
    if(!licenseApiConfigured()){
      LICENSE.error="License server address is not set yet. (Seller: open index.html, find apiBase near the top of the script, and put your Render URL between the quotes.)";
      render(); return;
    }
    LICENSE.busy=true; render();
    computeDeviceFingerprint().then(function(fp){
      return licenseFetch("/api/activate", { licenseKey:key, deviceHash:fp, deviceLabel:navigator.userAgent }, LICENSE_CONFIG.activateTimeoutMs).then(function(res){ return {res:res, fp:fp}; });
    }).then(function(r){
      LICENSE.busy=false;
      if(r.res.ok && r.res.data && r.res.data.token){
        return licenseSet("activation", { token:r.res.data.token, lastVerified:Date.now() }).then(function(){
          LICENSE.activateVals={}; bootApp();
        });
      } else {
        LICENSE.error = (r.res.data&&r.res.data.message) || "Activation failed \u2014 check the key and try again.";
        render();
      }
    }).catch(function(){
      LICENSE.busy=false;
      LICENSE.error="Couldn't reach the license server. Check your connection and try again.";
      render();
    });
  };
}

/* ============================================================
   ORB PART I TEMPLATES — Codes C, D, E, F, G, H, I
   Sourced from MEPC.1/Circ.736/Rev.2-style worked examples.
   positionMode: "required" | "optional" | "none"
     required -> lat/long dropdowns shown, must be completed
     optional -> position collapsed by default behind a toggle

function F(id,label,type,extra){
  var f={id:id,label:label,type:type||"text"};
  if(extra) for(var k in extra) f[k]=extra[k];
  return f;
}
function humanizeId(id){
  return String(id||"")
    .replace(/([a-z0-9])([A-Z])/g,"$1 $2")
    .replace(/_/g," ")
    .replace(/^./,function(c){return c.toUpperCase();});
}
var TM_LABELS = {
  start:"Time of start", stop:"Time of stop", time:"Time",
  failTime:"Time of failure", origTime:"Original failure time",
  restoreTime:"Time functional again"
};
var TANK = function(id,label){ return F(id,label||"Tank / designation","text",{ph:"e.g. Sludge Tank No.1 (P)", list:"tanklist"}); };
var QTY  = function(id,label,unit){ return F(id,label||humanizeId(id),"number",{unit:unit||"m³",step:"0.1"}); };
var TXT  = function(id,label,ph){ return F(id,label||humanizeId(id),"text",{ph:ph||""}); };
var TA   = function(id,label,ph){ return F(id,label||humanizeId(id),"textarea",{ph:ph||""}); };
var DT   = function(id,label){ return F(id, label, "datetime"); };
var TM   = function(id,label){ return F(id, label || TM_LABELS[id] || (humanizeId(id)+" time"), "time"); };

/* ============================================================
   RECORD-FORMAT ARCHITECTURE
       FLAG  ->  RECORD FORMAT  ->  MARPOL ANNEX  ->  OPERATION  ->  CODE
   (never OPERATION -> PANAMA CODE)

   1. FLAG          the Flag State chosen in Vessel tab.
   2. RECORD FORMAT what the flag Administration prescribes:
        PANAMA  = Panama ORB, Part I / II / III  (Panama Part III is a
                  Panama flag-specific record-book section).
        IMO_STD = IMO standard ORB, Part I / II only, plus an
                  "Annex VI Records" module. No Part III is assumed.
   3. MARPOL ANNEX  Annex I (oil)  -> Parts I & II
                    Annex VI (air) -> ODS / NOx / SOx / VOC / Incinerator
                    operations. These do NOT disappear when the flag is
                    not Panama; only where they are recorded changes.
   4. OPERATION     the template picked (e.g. ECA entry, ODS recharge).
   5. CODE          the code letter shown in the Register.

   The Annex VI operation data set keeps the internal part id "III" so
   entries saved by earlier versions stay valid; only its label, filing
   and notices depend on the record format.
   ============================================================ */
var PART3_DISCLAIMER = "Panama Part III is a Panama flag-specific record-book section. Do not assume that another flag uses a Part III. For non-Panama vessels, determine where the applicable MARPOL Annex VI information is required to be recorded under that flag Administration's current approved/prescribed record-keeping system.";
var RECORD_FORMATS = {
  PANAMA:  { id:"PANAMA",  label:"Panama ORB \u2014 Part I / II / III" },
  IMO_STD: { id:"IMO_STD", label:"IMO standard ORB \u2014 Part I / II, plus Annex VI Records module" }
};
var FLAG_RECORD_FORMAT = { "Panama":"PANAMA" };   /* every flag not listed here -> IMO_STD */
var MARPOL_ANNEX_OF_PART = { I:"Annex I", II:"Annex I", III:"Annex VI" };
var ANNEX_VI_REG = { A:"Reg. 12", B:"Reg. 13", C:"Reg. 14", D:"Reg. 15", E:"Reg. 16" };
function recordFormat(){
  var f=(STATE && STATE.vessel && STATE.vessel.flag) || "";
  return RECORD_FORMATS[FLAG_RECORD_FORMAT[f] || "IMO_STD"];
}
function isPanamaFormat(){ return recordFormat().id==="PANAMA"; }
function partLabel(p){ return p==="III" ? (isPanamaFormat() ? "Part III" : "Annex VI Records") : ("Part "+p); }
function partTitle(p){
  if(p==="III") return isPanamaFormat()
    ? "Part III \u2014 ODS / NOx / SOx / VOC / Incinerator (Panama)"
    : "Annex VI Records \u2014 ODS / NOx / SOx / VOC / Incinerator";
  return PART_TITLES[p];
}
function partFileTag(p){ return p==="III" ? (isPanamaFormat() ? "PartIII" : "AnnexVI") : ("Part"+p); }
function part3NoticeHTML(){
  var pan=isPanamaFormat(), flagSet=!!(STATE.vessel && STATE.vessel.flag);
  var head = pan ? "Panama Part III \u2014 flag-specific record section." : "Annex VI Records module (MARPOL Annex VI).";
  var body = pan ? "" :
    " Operations under Reg. 12 (ODS), Reg. 13 (NOx), Reg. 14 (SOx / fuel changeover), Reg. 15 (VOC) and Reg. 16 (shipboard incineration). The IMO standard Oil Record Book consists of Part I and Part II only. Item numbers follow the Panama Part III training template and are shown for reference. These records are kept in their own module and are not filed into Part I or Part II.";
  return '<div class="notice req"><b>'+esc(head)+'</b>'+esc(body)+

/* Live "present condition" bar shown right under any tank-designation field
   while filling out an entry, so the user can see the tank's current fill
   level without switching to the Vessel tab. Updated on every keystroke via
   a targeted DOM update (see bindNewEntry) rather than a full re-render, so
   typing in the field itself stays smooth. */
function renderTankLiveBar(name){
  var t=findTankByName(name);
  if(!t){
    return '<div class="hint" style="margin-top:2px;">'+
      (String(name||"").trim()
        ? 'No tank named \u201c'+esc(name)+'\u201d in the Tank tab \u2014 add it there first, or check the spelling.'
        : 'Start typing or pick a tank above to see its present condition here.')+
    '</div>';
  }
  if(!tankAllowedInPart(t, UI.part)){
    var tPart = t.part||"I";
    var tPartName = tPart==="II" ? "Part II (cargo/ballast)" : "Part I (machinery-space)";
    var wantPartName = UI.part==="II" ? "Part II (cargo/ballast)" : "Part I (machinery-space)";
    return '<div class="notice danger" style="margin:2px 0 0;">\u201c'+esc(t.name)+'\u201d is a '+tPartName+' tank and cannot be used in a '+esc(partLabel(UI.part))+' entry. Choose a '+wantPartName+' tank instead.</div>';
  }
  var cap=parseFloat(t.capacity)||0, vol=parseFloat(t.volume)||0;
  var pct = cap>0 ? Math.max(0,Math.min(100,(vol/cap)*100)) : 0;
  var cls = pct>=90?"danger":(pct>=70?"warn":"ok");
  return ''+
    '<div class="tankbar-hd"><span class="tn">'+icon("bar",12)+' '+esc(t.name)+' \u2014 present condition</span>'+
      '<span class="tv">'+n1(t.volume)+' / '+n1(t.capacity)+' m\u00b3'+(cap>0?' ('+pct.toFixed(0)+'%)':'')+'</span></div>'+
    '<div class="tankbar-track"><div class="tankbar-fill '+cls+'" style="width:'+pct+'%;"></div></div>';
}

function applyTankAutoUpdates(tplId, v){
  var map = TANK_AUTO_UPDATE[tplId];
  if(!map) return;
  map.forEach(function(pair){
    var tankName=v[pair[0]], volRaw=v[pair[1]];
    if(!tankName || volRaw===undefined || volRaw==="") return;
    var vol=parseFloat(volRaw);
    if(isNaN(vol)) return;
    var t=findTankByName(tankName);
    if(t) t.volume = vol;

/* ---------------- register bookkeeping: for a Panama-flag vessel, Part III is physically
   logged inside Book I (Codes A,B,C,E) or Book II (Code D — VOC, tankers only), so the
   Register merges it in chronologically. For every other flag the Annex VI Records module
   stays separate and is never merged into Book I / II. ---------------- */
function registerBookOf(e){
  if((e.part||"I")==="III"){
    /* Panama: Part III is physically logged inside Book I / II.
       Any other flag: Annex VI Records stay a separate module - never merged into Part I / II. */
    if(!isPanamaFormat()) return "III";
    return e.code==="D" ? "II" : "I";
  }
  return e.part||"I";
}
/* Register books: "I" and "II" as filed in the statutory book (Part III merged in); "III" lists every Part III entry on its own. */
function entriesForBook(book){
  return STATE.entries.filter(function(e){
    return book==="III" ? ((e.part||"I")==="III") : registerBookOf(e)===book;
  }).sort(function(a,b){ return (a.date+a.createdAt) < (b.date+b.createdAt) ? -1:1; });
}
function displayCode(e){
  return (e.part||"I")==="III" ? ((isPanamaFormat()?"III-":"VI-")+e.code) : e.code;
}

function findTemplate(part,code,id){
  var byPart = CODES_BY_PART[part]||CODES;
  var grp=byPart[code]; if(!grp) return null;
  for(var i=0;i<grp.templates.length;i++) if(grp.templates[i].id===id) return grp.templates[i];
  return null;
}
/* ---------------- validation: no negatives, no over-capacity tanks ---------------- */
function validateNoNegatives(tpl, v){
  for(var i=0;i<tpl.fields.length;i++){
    var f=tpl.fields[i];
    if(f.type==="number"){
      var raw=v[f.id];
      if(raw===undefined||raw==="") continue;
      var val=parseFloat(raw);
      if(!isNaN(val) && val<0) return "\u201c"+f.label+"\u201d cannot be a negative value.";
    }
  }
  return null;
}
function validateTankCapacity(tplId, v){
  var map = TANK_AUTO_UPDATE[tplId];
  if(!map) return null;
  for(var i=0;i<map.length;i++){
    var tankName=v[map[i][0]], volRaw=v[map[i][1]];
    if(!tankName || volRaw===undefined || volRaw==="") continue;
    var vol=parseFloat(volRaw);
    if(isNaN(vol)) continue;
    var t=findTankByName(tankName);
    if(t){
      var cap=parseFloat(t.capacity);
      if(!isNaN(cap) && cap>0 && vol>cap+1e-9){
        return "Resulting quantity in \u201c"+t.name+"\u201d ("+n1(vol)+" m\u00b3) would exceed its capacity of "+n1(cap)+" m\u00b3. Present tank quantity is not allowed to exceed its capacity.";
      }
    }
  }
  return null;
}

function buildFieldsHTML(tpl){

    var val = UI.formVals[f.id]!==undefined?UI.formVals[f.id]:"";
    var inner="";

    var isQtyBefore = qtySrc && f.id===qtySrc.qtyField;
    var srcMode = UI.qtySrcMode[tpl.id] || "manual";
    var toggleHTML = "";
    if(isQtyBefore){
      var tankNameNow = UI.formVals[qtySrc.tankField] || "";
      var tk = findTankByName(tankNameNow);
      if(srcMode==="auto"){
        val = tk ? n1OrBlank(tk.volume) : "";
        UI.formVals[f.id] = val;
      }
      toggleHTML = '<div class="seg qty-src-toggle" style="margin-bottom:6px;">'+
        '<button type="button" data-qtysrc="manual" class="'+(srcMode==="manual"?"active":"")+'">Manual input</button>'+
        '<button type="button" data-qtysrc="auto" class="'+(srcMode==="auto"?"active":"")+'">Use tank\u2019s present volume</button>'+
      '</div>'+
      (srcMode==="auto" ? '<div class="hint" style="margin:-2px 0 8px;">'+(tk? "Pulled from \u201c"+esc(tk.name)+"\u201d present volume ("+n1(tk.volume)+" m\u00b3). Enter the tank name above to link it." : "Enter the tank name/designation above \u2014 its present volume (from the Tank tab) will fill in here automatically.")+'</div>' : '');
    }

    if(f.type==="textarea"){
      inner='<textarea data-field="'+f.id+'" placeholder="'+esc(f.ph||"")+'">'+esc(val)+'</textarea>';
    } else if(f.type==="select"){
      inner='<select data-field="'+f.id+'">'+f.opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>';}).join("")+'</select>';
    } else if(f.type==="number"){
      inner='<input type="number" step="'+(f.step||"any")+'" min="0" data-field="'+f.id+'" value="'+esc(val)+'" placeholder="0.0"'+(isQtyBefore&&srcMode==="auto"?' readonly':'')+'>';
    } else if(f.type==="date"){
      inner='<input type="date" data-field="'+f.id+'" value="'+esc(val)+'">';
    } else if(f.type==="datetime"){
      inner=dtSelectHTML(f.id,val);
    } else if(f.type==="time"){
      inner=timeSelectHTML(f.id,val);
    } else {
      var isTankLink = qtySrc && f.id===qtySrc.tankField;
      var isTankField = f.list==="tanklist";
      if(isTankField){
        var tanksHere = tanksForPart(UI.part);
        var matchedTank = findTankByName(val);
        var valMatchesList = !!(val && matchedTank && tankAllowedInPart(matchedTank, UI.part));
        var otherVisible = !!val && !valMatchesList;
        inner = '<select data-tank-select="'+f.id+'">'+
            '<option value=""'+(val?'':' selected')+'>Select tank\u2026</option>'+
            tanksHere.map(function(t){ return '<option value="'+esc(t.name)+'"'+(t.name===val?' selected':'')+'>'+esc(t.name)+' \u2014 '+esc(t.type)+'</option>'; }).join("")+
            '<option value="__other__"'+(otherVisible?' selected':'')+'>Other / type manually\u2026</option>'+
          '</select>'+
          '<input type="text" data-field="'+f.id+'" value="'+esc(val)+'" placeholder="Type the tank name" id="tankOther-'+f.id+'"'+(isTankLink?' data-qty-tank-link="'+qtySrc.qtyField+'"':'')+
            ' style="margin-top:6px;'+(otherVisible?'':'display:none;')+'">'+
          '<div class="tankbar-row live" id="tanklive-'+f.id+'" style="margin-top:8px;margin-bottom:0;">'+renderTankLiveBar(val)+'</div>';
      } else {
        inner='<input type="text" data-field="'+f.id+'" value="'+esc(val)+'" placeholder="'+esc(f.ph||"")+'"'+(f.list?' list="'+f.list+'"':'')+(isTankLink?' data-qty-tank-link="'+qtySrc.qtyField+'"':'')+'>';
      }
    }
    var lbl = (f.label || humanizeId(f.id)) + (f.unit?' ('+f.unit+')':"");
    return '<div class="field"><label class="field-label">'+esc(lbl)+'</label>'+toggleHTML+inner+'</div>';
  }).join("");
}
function buildPositionHTML(tpl){

      '<div class="seg" style="margin-bottom:10px;">'+

/* Runs the same pre-save checks used on final save, so the Guided walkthrough
   can stop someone before they reach the review step with something that
   would be rejected anyway. Returns an error string, or null if OK. */
function precheckEntry(tpl, v){
  for(var pi=0; pi<tpl.fields.length; pi++){
    var pf=tpl.fields[pi];
    if(pf.list!=="tanklist") continue;
    var pt=findTankByName(v[pf.id]);
    if(pt && !tankAllowedInPart(pt, UI.part)){
      var ptPart = pt.part||"I";
      var ptPartName = ptPart==="II" ? "Part II (cargo/ballast)" : "Part I (machinery-space)";
      var wantPartName2 = UI.part==="II" ? "Part II (cargo/ballast)" : "Part I (machinery-space)";
      return "Not allowed: \u201c"+pt.name+"\u201d is a "+ptPartName+" tank and cannot be used in a "+partLabel(UI.part)+" entry \u2014 choose a "+wantPartName2+" tank instead.";
    }
  }
  var blockField = BILGE_DESTINATION_BLOCK[tpl.id];
  if(blockField && isBilgeTypeName(v[blockField])){
    return "Not allowed: transfer of sludge or oil into a Bilge tank is prohibited under MARPOL Annex I. Choose a sludge/fuel tank (not a Bilge Water/Bilge Holding tank) as the destination.";
  }
  var negErr = validateNoNegatives(tpl, v);
  if(negErr) return negErr;
  var capErr = validateTankCapacity(tpl.id, v);
  if(capErr) return capErr;
  return null;
}

/* ---------------- "H" suffix on recorded times (13:00H) ----------------
   The pickers and the raw values saved with each entry stay "HH:MM" /
   "dd-MON-yyyy HH:MM" (Assessment mode compares those). The suffix is
   added only to the record text that goes into the Register and the .docx. */
function hFmt(t){
  var x=String(t==null?"":t);
  if(/^\d{2}:\d{2}$/.test(x)) return x+"H";
  if(/^\d{2}-[A-Z]{3}-\d{4}\s+\d{2}:\d{2}$/.test(x)) return x+"H";
  return x;
}
/* Display-time pass over record text: any clock time 00:00-23:59 gets its H (13:00 -> 13:00H).
   Idempotent, so entries already saved with the H are left alone and older entries show it too. */
function hText(s){
  return String(s==null?"":s).replace(/(^|[^0-9:.])([01]\d|2[0-3]):([0-5]\d)(?![0-9H:])/g, "$1$2:$3H");
}
function withHourSuffix(tpl, v){
  var out={}, k;
  for(k in v) out[k]=v[k];
  tpl.fields.forEach(function(f){
    if((f.type==="time" || f.type==="datetime") && v[f.id]) out[f.id]=hFmt(v[f.id]);
  });
  return out;
}

/* ---------------- date-time entry: calendar date picker + 24-hour HH : MM dropdowns.
   The hidden input keeps the record-book format "dd-MON-yyyy hh:mm". ---------------- */
function parseDT(str){
  var m=/^(\d{2})-([A-Z]{3})-(\d{4})\s+(\d{2}):(\d{2})$/.exec(String(str||"").trim());
  if(!m) return null;
  var mi=MONTHS.indexOf(m[2]); if(mi<0) return null;
  return { iso:m[3]+"-"+pad(mi+1)+"-"+m[1], hh:m[4], mm:m[5], ms:new Date(+m[3],mi,+m[1],+m[4],+m[5]).getTime() };
}
function dtSelectHTML(id,val){
  var p=parseDT(val)||{iso:"",hh:"",mm:""}, hOpts='<option value="">HH</option>', mOpts='<option value="">MM</option>', i, t;
  for(i=0;i<24;i++){ t=pad(i); hOpts+='<option value="'+t+'"'+(t===p.hh?' selected':'')+'>'+t+'</option>'; }
  for(i=0;i<60;i++){ t=pad(i); mOpts+='<option value="'+t+'"'+(t===p.mm?' selected':'')+'>'+t+'</option>'; }
  return '<div class="dtsel" data-dtsel="'+id+'">'+
    '<input type="date" class="dt-d" value="'+esc(p.iso)+'" aria-label="Date">'+
    '<div class="timesel"><select class="ts-h" aria-label="Hour (24h)">'+hOpts+'</select><span class="colon">:</span><select class="ts-m" aria-label="Minute">'+mOpts+'</select><span class="colon hsfx" title="Hours (24-hour clock)">H</span></div>'+
    '<input type="hidden" data-field="'+id+'" value="'+esc(val||"")+'">'+
  '</div>';
}
function bindDTSelects(){
  var boxes={};
  document.querySelectorAll("[data-dtsel]").forEach(function(box){ boxes[box.getAttribute("data-dtsel")]=box; });
  function sync(box,changed){
    var d=box.querySelector(".dt-d"), h=box.querySelector(".ts-h"), m=box.querySelector(".ts-m"), hid=box.querySelector("input[type=hidden]");
    if(changed==="h" && h.value && !m.value) m.value="00";

      sync(box,"d");

/* ---------------- shared save routine: same checks & write path for the
   Normal Entry Form's "Add entry" button and the Guided walkthrough's review step.
   Returns true if the entry was saved, false if it was blocked (an alert
   explaining why has already been shown). ---------------- */
function trySaveEntry(){
  collectFormVals();
  var tpl=findTemplate(UI.part,UI.codeSel,UI.tplSel);
  var v=UI.formVals;
  if(tpl.positionMode==="required"){
    v.posStart = posText(v,"pos");
    if(tpl.positionLabel==="start/stop" || tpl.positionLabel==="start/end") v.posStop = posText(v,"posStop2_");
  } else if(tpl.positionMode==="optional" && UI.posMode==="INCLUDE"){
    v.posStart = posText(v,"pos");
  }
  var preErr = precheckEntry(tpl, v);
  if(preErr){ alert(preErr); return false; }
  var rows = cleanRows(tpl.rows(withHourSuffix(tpl,v)));
  var tankBefore = {};
  STATE.tanks.forEach(function(t){ var pv=parseFloat(t.volume); tankBefore[String(t.name||"").trim().toLowerCase()] = isNaN(pv)?null:pv; });
  var entry = {
    id: uid("orb"),
    date: v.__date || todayISO(),
    part: UI.part,
    code: UI.codeSel,
    templateId: tpl.id,
    templateName: tpl.name,
    rows: rows,
    vals: JSON.parse(JSON.stringify(v)),
    tankBefore: tankBefore,
    officer: (v.__ofName||"")+(v.__ofRank? " ("+v.__ofRank+")":""),
    signature: null,
    createdAt: Date.now()
  };
  STATE.entries.push(entry);
  applyTankAutoUpdates(tpl.id, v);
  saveState();
  UI.formVals={};
  UI.posMode="SKIP";
  UI.qtySrcMode[UI.tplSel]="manual";
  toast("Entry added \u2014 "+partLabel(UI.part)+", Code "+UI.codeSel+" \u2014 sign it from the Sign tab");
  return true;
}

ed]","[xx.x m³]","[xxxxx]","[xxxxxx]","[xxxxxxx]"];
var ASSESS_SLUDGE=["Sludge","Waste Oil"], ASSESS_BILGE=["Bilge Water","Bilge Holding"], ASSESS_FUEL=["Fuel Oil","Diesel Oil"], ASSESS_LUBE=["Lube Oil"];
var ASSESS_TANK_TYPES = {

  c_incin_sludge:{tank:ASSESS_SLUDGE}, c_evap:{tank:ASSESS_SLUDGE}, c_boiler:{tank:ASSESS_SLUDGE}, c_slop:{tank:ASSESS_SLUDGE},

  i_internal_fo:{from:ASSESS_FUEL,to:ASSESS_FUEL}, i_debunker:{tank1:ASSESS_FUEL}

/* quantity arithmetic: tank volume before  +/-  quantity moved  =  quantity retained */

  c_disposal_ashore:[{tank:"tank",qty:"transferred",res:"retained",sign:-1}],
  c_drain_bilge:[{tank:"tank",qty:"drained",res:"retained1",sign:-1},{tank:"bilgeTank",qty:"drained",res:"retained2",sign:1}],
  c_internal_transfer:[{tank:"from",qty:"qty",res:"retained1",sign:-1},{tank:"to",qty:"qty",res:"retained2",sign:1}],
  c_incin_sludge:[{tank:"tank",qty:"qty",res:"retained",sign:-1}],
  c_evap:[{tank:"tank",qty:"qty",res:"retained",sign:-1}],
  c_boiler:[{tank:"tank",qty:"qty",res:"retained",sign:-1}],
  c_slop:[{tank:"tank",qty:"qty",res:"retained",sign:-1}],
  d_wells_to_holding:[{tank:"to",qty:"qty",res:"retained",sign:1}],
  d_tank_to_tank:[{tank:"from",qty:"qty",res:"retained1",sign:-1},{tank:"to",qty:"qty",res:"retained2",sign:1}],
  d_to_sludge:[{tank:"from",qty:"qty",res:"retained1",sign:-1},{tank:"sludge",qty:"qty",res:"retained2",sign:1}],
  i_internal_fo:[{tank:"from",qty:"qty",res:"retained1",sign:-1},{tank:"to",qty:"qty",res:"retained2",sign:1}],
  j_slop_to_slop:[{tank:"from",qty:"transferred",res:"retained1",sign:-1},{tank:"to",qty:"transferred",res:"retained2",sign:1}],
  j_ballast_to_slop:[{tank:"from",qty:"qty",res:"retained1",sign:-1},{tank:"to",qty:"qty",res:"retained2",sign:1}],
  j_disposal_ashore:[{tank:"tank",qty:"qty",res:"retained",sign:-1}]
};
function assessFieldLabel(tpl,id){
  for(var i=0;i<tpl.fields.length;i++) if(tpl.fields[i].id===id) return tpl.fields[i].label||humanizeId(id);
  return humanizeId(id);
}
function assessPlaceholderHit(txt){
  for(var i=0;i<ORB_PLACEHOLDERS.length;i++) if(txt.indexOf(ORB_PLACEHOLDERS[i])>-1) return ORB_PLACEHOLDERS[i];
  var m=/hh:mm|dd-MON|\bx{2,}(?:\.x)?\b|\bx\.x\b/.exec(txt);
  return m?m[0]:null;
}
function assessEntry(e, earlierMax){
  var R={errs:[],warns:[],info:[]}, part=e.part||"I";
  var tpl=findTemplate(part,e.code,e.templateId), v=e.vals||null;
  var offName=String(e.officer||"").replace(/\s*\(.*\)\s*$/,"").trim();
  if(!offName) R.errs.push("\u201cPrepared by\u201d has no officer name \u2014 the person making the entry must be identified.");
  else if(!/\(.+\)\s*$/.test(String(e.officer))) R.warns.push("Officer rank is missing in \u201cPrepared by\u201d.");
  if(e.date>todayISO()) R.errs.push("Entry date "+fmtDate(e.date)+" is in the future.");
  if(earlierMax) R.warns.push("Entry date is earlier than a previously recorded entry ("+fmtDate(earlierMax)+") \u2014 ORB entries must be in chronological order.");
  if(!e.signature) R.info.push("Not signed yet.");
  if(!tpl) R.warns.push("This entry\u2019s template is no longer available \u2014 only general checks were applied.");

  if(!v || !tpl){
    var txt=(e.rows||[]).map(function(r){return r.text;}).join(" | ");
    var hit=assessPlaceholderHit(txt);
    if(hit) R.errs.push("The record still contains unfilled placeholder text (\u201c"+hit+"\u201d).");
    if(txt.indexOf("0\u00b00.0' N, 0\u00b00.0' E")>-1) R.errs.push("Position was left at the default 0\u00b0 00.0\u2032 N, 0\u00b0 00.0\u2032 E.");
    if(!v) R.info.push("Saved before Assessment mode existed \u2014 only basic checks were possible. Re-enter it for the full check.");
    return R;
  }

  /* 1 — blank fields */
  var blanks=[];
  tpl.fields.forEach(function(f){ var x=v[f.id]; if(x===undefined || String(x).trim()==="") blanks.push(f.label||humanizeId(f.id)); });
  if(blanks.length) R.errs.push("Blank field"+(blanks.length>1?"s":"")+": "+blanks.join(", ")+".");

  /* 2 — position */
  ["posStart","posStop"].forEach(function(k){
    if(v[k]!==undefined && /^0\u00b00\.0' N, 0\u00b00\.0' E$/.test(v[k])) R.errs.push("Position ("+(k==="posStart"?"start":"stop")+") was left at the default 0\u00b0 00.0\u2032 N, 0\u00b0 00.0\u2032 E.");
  });
  if(tpl.positionMode==="required" && !v.posStart) R.errs.push("A position is required for this entry but none was recorded.");

  /* 3 — numbers */
  tpl.fields.forEach(function(f){
    if(f.type!=="number") return;
    var n=parseFloat(v[f.id]); if(isNaN(n)) return;
    if(n<0) R.errs.push("\u201c"+(f.label||f.id)+"\u201d is negative.");
  });
  if(v.hours!==undefined && v.hours!==""){
    var hr=parseFloat(v.hours);
    if(!isNaN(hr) && hr<=0) R.errs.push("\u201cHours run\u201d must be greater than zero.");
    else if(!isNaN(hr) && hr>24) R.errs.push("\u201cHours run\u201d ("+hr+" h) exceeds 24 hours for a single entry.");
  }

  /* 4 — times & date-times */
  [["start","stop"],["start","end"]].forEach(function(pr){
    var a=v[pr[0]], b=v[pr[1]]; if(!a||!b) return;
    if(a===b) R.errs.push("Start and "+pr[1]+" times are identical ("+hFmt(a)+") \u2014 the operation has no duration.");
    else if(b<a) R.warns.push("The "+pr[1]+" time ("+hFmt(b)+") is earlier than the start ("+hFmt(a)+") \u2014 correct only if the operation ran past midnight.");
  });
  var sd=parseDT(v.startDT), ed=parseDT(v.stopDT);
  if(sd && ed){
    if(ed.ms<=sd.ms) R.errs.push("Stop date-time ("+hFmt(v.stopDT)+") is not after the start date-time ("+hFmt(v.startDT)+").");
    else if(ed.ms-sd.ms>72*3600*1000) R.warns.push("The operation lasts more than 72 hours \u2014 check the dates.");
  }
  if(sd && sd.iso!==e.date) R.warns.push("Operation start date ("+fmtDate(sd.iso)+") differs from the entry date ("+fmtDate(e.date)+").");

  /* 5 — tanks */
  var used=[];
  tpl.fields.forEach(function(f){
    if(f.list!=="tanklist") return;
    var name=String(v[f.id]||"").trim(); if(!name) return;
    var label=f.label||humanizeId(f.id), t=findTankByName(name);
    used.push(name.toLowerCase());
    if(!t){ R.errs.push("\u201c"+label+"\u201d: tank \u201c"+name+"\u201d is not listed in the Tank tab (IOPP Supplement Item 3)."); return; }
    var allowed=(ASSESS_TANK_TYPES[tpl.id]||{})[f.id];
    if(allowed && t.type!=="Other" && allowed.indexOf(t.type)<0)
      R.errs.push("\u201c"+label+"\u201d: \u201c"+t.name+"\u201d is a "+t.type+" tank \u2014 this operation needs a "+allowed.join(" / ")+" tank.");
    var tp=t.part||"I";
    if((part==="I"||part==="II") && tp!==part) R.warns.push("\u201c"+t.name+"\u201d is registered as a Part "+tp+" tank but this is a Part "+part+" entry.");
  });
  var dup=used.filter(function(n,i){ return used.indexOf(n)!==i; });
  if(dup.length) R.errs.push("The same tank is used twice in one entry (\u201c"+dup[0]+"\u201d).");
  var bf=BILGE_DESTINATION_BLOCK[tpl.id];
  if(bf && isBilgeTypeName(v[bf])) R.errs.push("Sludge / oil was transferred into a Bilge tank \u2014 prohibited under MARPOL Annex I (bilge tanks receive settled water only).");

  /* 6 — quantity arithmetic against the tank volume recorded before the entry */
  var before=e.tankBefore||null;
  (ASSESS_MATH[tpl.id]||[]).forEach(function(r){
    var qty=parseFloat(v[r.qty]), res=parseFloat(v[r.res]), nm=String(v[r.tank]||"").trim().toLowerCase();
    if(isNaN(qty)||isNaN(res)||!nm) return;
    var ql=assessFieldLabel(tpl,r.qty), tk=findTankByName(nm)?findTankByName(nm).name:v[r.tank];
    if(qty<=0){ R.errs.push("\u201c"+ql+"\u201d must be greater than zero."); return; }
    var b=(before && before[nm]!==undefined && before[nm]!==null)?parseFloat(before[nm]):NaN;
    if(isNaN(b)) return;
    var exp=b+r.sign*qty;
    if(r.sign<0 && qty>b+0.05) R.errs.push("\u201c"+tk+"\u201d held only "+n1(b)+" m\u00b3 before this entry, yet "+n1(qty)+" m\u00b3 was taken out.");
    else if(Math.abs(exp-res)>0.05) R.errs.push("\u201c"+tk+"\u201d: "+n1(b)+" m\u00b3 "+(r.sign<0?"\u2212":"+")+" "+n1(qty)+" m\u00b3 should leave "+n1(exp)+" m\u00b3, but the entry says "+n1(res)+" m\u00b3.");
  });
  if(tpl.id==="c_manual_collect"){
    var i0=parseFloat(v.initial), f0=parseFloat(v.final), c0=parseFloat(v.collected);
    if(!isNaN(i0)&&!isNaN(f0)&&!isNaN(c0) && Math.abs(i0+c0-f0)>0.05) R.errs.push("Quantity before ("+n1(i0)+") + collected ("+n1(c0)+") should equal "+n1(i0+c0)+" m\u00b3, but \u201cQuantity after\u201d is "+n1(f0)+" m\u00b3.");
    var nb=String(v.tank||"").trim().toLowerCase();
    if(before && before[nb]!==undefined && before[nb]!==null && !isNaN(i0) && Math.abs(before[nb]-i0)>0.05) R.errs.push("\u201cQuantity before\u201d ("+n1(i0)+" m\u00b3) does not match the tank\u2019s recorded volume ("+n1(before[nb])+" m\u00b3).");
  }

  /* 7 — tank capacity */
  (TANK_AUTO_UPDATE[tpl.id]||[]).forEach(function(pair){
    var t=findTankByName(v[pair[0]]), x=parseFloat(v[pair[1]]);
    if(!t||isNaN(x)) return;
    var cap=parseFloat(t.capacity);
    if(!isNaN(cap)&&cap>0&&x>cap+1e-9) R.errs.push("Resulting quantity in \u201c"+t.name+"\u201d ("+n1(x)+") exceeds its capacity of "+n1(cap)+" m\u00b3.");
  });

  /* 8 — equipment limits & bunker checks */
  if(tpl.id==="c_incin_sludge"){
    var cap=parseFloat(STATE.vessel.incinCapLiquid), q=parseFloat(v.qty), h=parseFloat(v.hours);
    if(cap>0 && q>0 && h>0 && q>cap*h/1000+1e-9) R.errs.push(n1(q)+" m\u00b3 cannot be burnt in "+h+" h by an incinerator rated "+n1(cap)+" L/hr (maximum "+(cap*h/1000).toFixed(2)+" m\u00b3).");
  }
  if(tpl.id==="h_fo"){
    var sx=parseFloat(v.sulfur);
    if(!isNaN(sx) && sx>0.5) R.warns.push("Sulfur "+sx+"% m/m exceeds the 0.50% global limit \u2014 acceptable only with an approved exhaust gas cleaning system.");
  }
  return R;
}
function assessAll(){
  var list=STATE.entries.slice().sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
  var res={}, maxD="";
  list.forEach(function(e){
    res[e.id]=assessEntry(e, (maxD && e.date<maxD)?maxD:null);
    if(e.date>maxD) maxD=e.date;
  });
  return res;
}

    return '<button class="chip'+(STATE.filterCode===c?' active':'')+'" data-filter-code="'+c+'">'+c+'</button>';

  if(assessOn){

    entries.forEach(function(e){ var r=AR[e.id]; if(r.errs.length) nBad++; else if(r.warns.length) nRev++; else nOk++; });
    var only=!!STATE.assessOnlyWrong;

      '<div class="hint" style="margin-top:8px;">'+(entries.length? (nOk+' of '+entries.length+' entries in this view are correct ('+Math.round(nOk*100/entries.length)+'%).') : 'No entries in this view.')+'</div>'+
      '<div class="chiprow" style="margin-top:8px;"><button class="chip'+(!only?' active':'')+'" data-assess-only="0">Show all</button><button class="chip'+(only?' active':'')+'" data-assess-only="1">Wrong only</button></div>';
    if(only) entries=entries.filter(function(e){ return AR[e.id].errs.length>0; });

          '<td class="c-rec">'+esc(hText(r.text))+'</td>'+

      if(A){

        A.warns.forEach(function(m){ fh+='<div class="af af-warn">\u26a0 '+esc(m)+'</div>'; });
        A.info.forEach(function(m){ fh+='<div class="af af-info">\u2139 '+esc(m)+'</div>'; });
        if(!A.errs.length && !A.warns.length) fh='<div class="af af-ok">\u2713 No problems found.</div>'+fh;

      '<tbody>'+bodyRows+'</tbody>'+
    '</table>'+
  '</div>'+

  '<div class="hint" style="text-align:center;margin-top:6px;">You will be asked which entries to include \u2014 Part I, Part II, '+(isPanamaFormat()?"Part III":"Annex VI Records")+', or any combination. The .docx opens offline and includes vessel particulars, regardless of the filters above.</div>';

function bindRegister(){

    b.onclick=function(){ STATE.filterPart=this.getAttribute("data-filter-part"); STATE.filterCode="ALL"; saveState(); renderMain(); };

  });

    '</div>';
  document.body.appendChild(back);
  var all=back.querySelector("#exAll"), boxes=[].slice.call(back.querySelectorAll(".exPart"));
  function syncAll(){ all.checked = boxes.every(function(b){return b.checked;}); }
  all.addEventListener("change", function(){ boxes.forEach(function(b){ b.checked=all.checked; }); });
  boxes.forEach(function(b){ b.addEventListener("change", syncAll); });
  back.querySelector("#exCancel").onclick=function(){ back.remove(); };
  back.addEventListener("click", function(ev){ if(ev.target===back) back.remove(); });
  back.querySelector("#exGo").onclick=function(){
    var parts=boxes.filter(function(b){return b.checked;}).map(function(b){return b.value;});

function exportRegisterWord(parts){
  parts = (parts && parts.length) ? parts : ["I","II","III"];
  var v=STATE.vessel;
  var blocks=[];

  blocks.push({type:"h1", text:"e-ORB MARINE \u2014 Oil Record Book Register"});
  blocks.push({type:"p", text:"FOR TRAINING PURPOSES ONLY \u2014 this is a practice/training record, not a statutory MARPOL Oil Record Book.", bold:true, color:"B23A32"});
  blocks.push({type:"p", text:"Exported "+fmtDate(todayISO())+".", color:"555555", size:18});

  blocks.push({type:"h2", text:"Vessel Particulars"});
  blocks.push({type:"table", header:["Field","Value"], widths:[3000,6360], rows:[
    ["Vessel name", v.name||"\u2014"], ["IMO number", v.imo||"\u2014"], ["Flag State", v.flag||"\u2014"], ["Record format", recordFormat().label],
    ["Master", v.master||"\u2014"], ["Chief Engineer", v.chiefEngineer||"\u2014"],
    ["Bilge pump capacity", (v.bilgePPCap?n1(v.bilgePPCap)+" m\u00b3/hr":"\u2014")],
    ["OWS discharge capacity", (v.owsDischargeCap?n1(v.owsDischargeCap)+" m\u00b3/hr":"\u2014")],

    ["Incinerator capacity \u2014 solid", (v.incinCapSolid?n1(v.incinCapSolid)+" kg/hr":"\u2014")],
    ["Incinerator capacity \u2014 liquid", (v.incinCapLiquid?n1(v.incinCapLiquid)+" L/hr":"\u2014")]
  ]});

  blocks.push({type:"h2", text:"Tank Details (IOPP Certificate, Supplement Item 3)"});
  var tankTableRows = STATE.tanks.map(function(t){ return [t.name, t.type, n1(t.capacity), n1(t.volume)]; });
  if(tankTableRows.length===0) tankTableRows=[["No tanks recorded.","","",""]];
  blocks.push({type:"table", header:["Tank","Type","Capacity (m\u00b3)","Present volume (m\u00b3)"], widths:[3500,2500,1680,1680], rows:tankTableRows});

  parts.forEach(function(part){
    var entries = entriesForBook(part);
    blocks.push({type:"h2", text:(part==="III" && !isPanamaFormat() ? "Annex VI Records (MARPOL Annex VI)" : "ORB Part "+part)+" \u2014 Tabulated Register"});

          tRows.push([idx===0?fmtDate(e.date):"", idx===0?displayCode(e):"", r.item, hText(r.text)]);
        });
        var sigTxt = e.signature ? ("Signed: "+e.signature.name+(e.signature.rank?" ("+e.signature.rank+")":"")+" \u2014 "+fmtDate(e.signature.date)) : "PENDING SIGNATURE";
        tRows.push(["","","","Prepared by: "+(e.officer||"\u2014")+"  |  "+sigTxt]);
      });
    }
    blocks.push({type:"table", header:["Date","Code","Item","Record of operations / signature"], widths:[1600,900,900,5960], rows:tRows});
  });

  blocks.push({type:"p", text:"Reference: MARPOL Annex I \u2014 Oil Record Book Parts I\u2013II; MARPOL Annex VI operations recorded as Panama ORB Part III (Panama flag) or as an Annex VI Records module (other flags); IMO MEPC.1/Circ.736/Rev.2 worked-example formats, AMSA 229 and Panama ORB Part III templates. This export is a training/practice aid \u2014 the vessel\u2019s official statutory Oil Record Book remains the paper or approved electronic ORB.", italic:true, color:"555555", size:18});

  var bytes = buildDocxBytes(blocks);
  var blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  var a = document.createElement("a");
  var vname = (STATE.vessel.name||"vessel").replace(/[^a-z0-9]+/gi,"_");
  a.href = URL.createObjectURL(blob);
  var partTag = parts.length===3 ? "AllParts" : parts.map(partFileTag).join("-");
  a.download = "eORB_Register_"+vname+"_"+partTag+"_"+todayISO()+".docx";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Register ("+(parts.length===3?"all sections":parts.map(partLabel).join(" + "))+") exported as .docx");
}

function initSignaturePad(){

  if(!canvas) return;
  var hiddenInput=document.getElementById("sigMark");
  var placeholder=document.getElementById("sigPadPlaceholder");
  var hint=document.getElementById("sigPadHint");
  var ctx=canvas.getContext("2d");
  var ratio=window.devicePixelRatio||1;
  var cssW=canvas.clientWidth||300, cssH=canvas.clientHeight||150;
  canvas.width=cssW*ratio; canvas.height=cssH*ratio;
  ctx.scale(ratio,ratio);
  ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#14213d";

  var drawing=false, hasInk=false, lastX=0, lastY=0;

  function pos(evt){
    var rect=canvas.getBoundingClientRect();
    var cx=(evt.touches&&evt.touches[0])?evt.touches[0].clientX:evt.clientX;
    var cy=(evt.touches&&evt.touches[0])?evt.touches[0].clientY:evt.clientY;
    return { x: cx-rect.left, y: cy-rect.top };
  }
  function start(evt){
    evt.preventDefault();
    drawing=true;
    var p=pos(evt); lastX=p.x; lastY=p.y;
    if(placeholder) placeholder.style.display="none";
  }
  function move(evt){
    if(!drawing) return;
    evt.preventDefault();
    var p=pos(evt);
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
    lastX=p.x; lastY=p.y; hasInk=true;
  }
  function end(evt){
    if(!drawing) return;
    drawing=false;
    if(hasInk) capture();
  }
  function capture(){
    var dataURL=canvas.toDataURL("image/png");
    if(hiddenInput) hiddenInput.value=dataURL;
    UI.signVals=UI.signVals||{}; UI.signVals.mark=dataURL;
    if(hint) hint.textContent="Signature captured.";
  }
  canvas.addEventListener("mousedown",start);
  canvas.addEventListener("mousemove",move);
  window.addEventListener("mouseup",end);
  canvas.addEventListener("touchstart",start,{passive:false});
  canvas.addEventListener("touchmove",move,{passive:false});
  canvas.addEventListener("touchend",end,{passive:false});

  // restore a previously drawn signature (e.g. returning to this panel)
  var existing=(UI.signVals&&UI.signVals.mark)||"";
  if(existing){
    var img=new Image();
    img.onload=function(){ ctx.drawImage(img,0,0,cssW,cssH); };
    img.src=existing;
    hasInk=true;
    if(placeholder) placeholder.style.display="none";
  }

  var clearBtn=document.getElementById("sigPadClear");
  if(clearBtn) clearBtn.onclick=function(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    hasInk=false;
    if(hiddenInput) hiddenInput.value="";
    UI.signVals=UI.signVals||{}; UI.signVals.mark="";
    if(placeholder) placeholder.style.display="flex";
    if(hint) hint.textContent="Nothing signed yet.";
  };
}

    if(!name){ alert("Tank name is required"); return; }
    var capF=parseFloat(cap), volF=parseFloat(vol);
    if(!isNaN(capF) && capF<0){ alert("Capacity cannot be a negative value."); return; }
    if(!isNaN(volF) && volF<0){ alert("Present volume cannot be a negative value."); return; }
    if(!isNaN(capF) && !isNaN(volF) && capF>0 && volF>capF){ alert("Present volume ("+n1(volF)+" m\u00b3) cannot exceed the tank's capacity ("+n1(capF)+" m\u00b3)."); return; }
    if(UI.tankForm.id==="new"){
      STATE.tanks.push({id:uid("tk"),name:name,type:type,part:part,capacity:cap,volume:vol});
    } else {
      var t=STATE.tanks.filter(function(t){return t.id===UI.tankForm.id;})[0];
      if(t){ t.name=name; t.type=type; t.part=part; t.capacity=cap; t.volume=vol; }
    }
    saveState();
    UI.tankForm=null;
    renderMain();
    toast("Tank saved");
  };
  var tankCancel=document.getElementById("tankCancel");
  if(tankCancel) tankCancel.onclick=function(){ UI.tankForm=null; renderMain(); };
}

function bindAbout(){
