/* ---------------- shell / nav ---------------- */
/* Setup checklist: Vessel -> Tanks -> First entry. Persistent (not a one-time
   dialog) so the instruction survives even if the first-run tour was skipped
   or closed early. Retires itself permanently once all three are done; can be
   collapsed for the current session via the "Hide for now" link, but returns
   next time the app is opened if still incomplete \u2014 it should never block
   the person from working, only keep the next step visible and one tap away. */
function setupChecklistStatus(){
  var v = STATE.vessel||{};
  return {
    vesselDone: !!(v.name && v.imo),
    tanksDone: (STATE.tanks||[]).length>0,
    entryDone: (STATE.entries||[]).length>0
  };
}
function vesselSetupBanner(){
  var st = setupChecklistStatus();
  if(st.vesselDone && st.tanksDone && st.entryDone) return "";
  if(UI.setupChecklistHidden) return "";
  var steps = [
    {done:st.vesselDone, label:"Fill in vessel particulars", action:"Go to Vessel tab", go:"vessel"},
    {done:st.tanksDone, label:"Add at least one tank", action:"Add a tank", go:"tank"},
    {done:st.entryDone, label:"Log your first ORB entry", action:"Start New Entry", go:"new"}
  ];
  var rows = steps.map(function(s,i){
    var isNext = !s.done && steps.slice(0,i).every(function(p){return p.done;});
    return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;'+(i<steps.length-1?'border-bottom:1px solid var(--border-lo);':'')+'">'+
      '<span style="flex:none;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;'+
        (s.done?'background:var(--ok);color:#06210f;':'border:1.5px solid var(--text-dim-2);color:var(--text-dim-2);')+'">'+(s.done?'\u2713':(i+1))+'</span>'+
      '<span style="flex:1;font-size:12.5px;'+(s.done?'color:var(--text-dim-2);text-decoration:line-through;':'color:var(--text);')+'">'+esc(s.label)+'</span>'+
      (isNext? '<button class="btn btn-primary btn-sm" data-setup-go="'+s.go+'" style="flex:none;">'+esc(s.action)+'</button>' : '')+
    '</div>';
  }).join("");
  return '<div class="notice req" style="padding:10px 12px 6px;">'+
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">'+
      '<span>'+icon("vessel",16)+'</span><b style="flex:1;font-size:12.5px;">Finish setup before logging a real entry</b>'+
      '<button class="btn-ghost" id="setupHideBtn" style="background:none;border:none;color:var(--text-dim-2);font-size:11px;cursor:pointer;padding:2px 4px;">Hide for now</button>'+
    '</div>'+
    rows+
  '</div>';
}
function renderRoute(){
  var banner = (UI.tab!=="vessel" && UI.tab!=="tank" && UI.tab!=="about") ? vesselSetupBanner() : "";
  if(UI.tab==="new") return banner+renderNewEntry();
  if(UI.tab==="register") return banner+renderRegister();
  if(UI.tab==="sign") return banner+renderSign();
  if(UI.tab==="vessel") return renderVessel();
  if(UI.tab==="tank") return renderTank();
  if(UI.tab==="about") return renderAbout();
  return banner+renderNewEntry();
}
function bindRoute(){
  var goV=document.getElementById("goVesselBtn");
  if(goV) goV.onclick=function(){ UI.tab="vessel"; render(); };
  document.querySelectorAll("[data-setup-go]").forEach(function(b){
    b.onclick=function(){ UI.tab=this.getAttribute("data-setup-go"); render(); };
  });
  var hideBtn=document.getElementById("setupHideBtn");
  if(hideBtn) hideBtn.onclick=function(){ UI.setupChecklistHidden=true; render(); };
  if(UI.tab==="new") bindNewEntry();
  else if(UI.tab==="register") bindRegister();
  else if(UI.tab==="sign") bindSign();
  else if(UI.tab==="vessel") bindVessel();
  else if(UI.tab==="tank") bindTank();
  else if(UI.tab==="about") bindAbout();
}

/* ---------------- render: Login / lock screens ---------------- */
function renderLoginScreen(){
  var lv=UI.loginVals;
  return '<div class="auth-bg">'+
  '<div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;max-width:400px;margin:0 auto;">'+
    '<div style="text-align:center;margin-bottom:22px;">'+
      '<div><img src="'+APP_ICON+'" alt="e-ORB MARINE" style="width:96px;height:96px;border-radius:20px;box-shadow:0 0 24px rgba(47,142,242,.3);"></div>'+
      '<div class="brand" style="font-size:19px;margin-top:6px;">e-ORB MARINE</div>'+
      '<div class="hint" style="margin-top:2px;">Oil Record Book \u2014 Training &amp; Practice</div>'+
    '</div>'+
    '<div class="notice" style="border-color:var(--danger);border-left-color:var(--danger);color:var(--danger);margin-bottom:12px;text-align:center;">FOR TRAINING PURPOSES ONLY \u2014 this app is a practice aid and is not a statutory MARPOL Oil Record Book or an approved electronic record book.</div>'+
    '<div class="card">'+
      '<h2 class="section-h" style="margin-top:0;">Sign in</h2>'+
      '<div class="field"><label class="field-label field-req">Name</label><input type="text" id="loName" value="'+esc(lv.name||"")+'" placeholder="Full name"></div>'+
      '<div class="field"><label class="field-label field-req">Rank</label><input type="text" id="loRank" value="'+esc(lv.rank||"")+'" placeholder="e.g. Third Engineer, Cadet"></div>'+
      '<div class="field"><label class="field-label">Set a device PIN (optional)</label><input type="text" inputmode="numeric" maxlength="6" id="loPin" value="'+esc(lv.pin||"")+'" placeholder="4\u20136 digits, leave blank to skip"></div>'+
      '<button class="btn btn-primary btn-block" id="loginBtn">Continue</button>'+
    '</div>'+
    '<div class="notice">Your name and rank are used to sign ORB entries you add. A PIN only locks the app screen on this device \u2014 it is not encryption and does not protect the underlying data.</div>'+
  '</div></div>';
}
function bindLoginScreen(){
  ["loName","loRank","loPin"].forEach(function(id){
    var el=document.getElementById(id);
    if(!el) return;
    var key = id==="loName"?"name":id==="loRank"?"rank":"pin";
    el.addEventListener("input", function(){ UI.loginVals[key]=this.value; });
  });
  var btn=document.getElementById("loginBtn");
  if(btn) btn.onclick=function(){
    var name=(document.getElementById("loName").value||"").trim();
    var rank=(document.getElementById("loRank").value||"").trim();
    var pin=(document.getElementById("loPin").value||"").trim();
    if(!name || !rank){ alert("Name and rank are required"); return; }

    var prevName=((STATE.auth&&STATE.auth.name)||"").trim().toLowerCase();
    var isNewUser = prevName!=="" && prevName!==name.trim().toLowerCase();
    if(isNewUser){ archiveSessionAndReset(); }

    STATE.auth = { name:name, rank:rank, pin:pin };
    saveState();
    UI.loginVals={};
    UI.screen="app";
    UI.tab="new";
    if(!STATE.hasSeenTour){ UI.tourStep=1; STATE.hasSeenTour=true; saveState(); }
    if(isNewUser){ toast("Previous session saved. Starting a new blank logbook for "+name+"."); }
    else { render(); }
  };
}

function renderLockScreen(){
  return ''+
  '<div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;max-width:400px;margin:0 auto;">'+
    '<div style="text-align:center;margin-bottom:22px;">'+
      '<div style="color:var(--accent);"><img src="'+APP_ICON+'" alt="e-ORB MARINE" style="width:64px;height:64px;border-radius:16px;"></div>'+
      '<div class="brand" style="font-size:19px;margin-top:6px;">Welcome back, '+esc(STATE.auth.name||"")+'</div>'+
      '<div class="hint" style="margin-top:2px;">'+esc(STATE.auth.rank||"")+'</div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="field"><label class="field-label">Enter PIN</label><input type="text" inputmode="numeric" maxlength="6" id="pinInput" placeholder="\u2022\u2022\u2022\u2022"></div>'+
      '<button class="btn btn-primary btn-block" id="unlockBtn">Unlock</button>'+
    '</div>'+
    '<button class="btn btn-ghost btn-block" id="notMeBtn" style="margin-top:10px;">Not you? Sign in as someone else</button>'+
  '</div>';
}
function bindLockScreen(){
  var unlockBtn=document.getElementById("unlockBtn");
  if(unlockBtn) unlockBtn.onclick=function(){
    var pin=(document.getElementById("pinInput").value||"").trim();
    if(pin===STATE.auth.pin){ UI.screen="app"; render(); }
    else { alert("Incorrect PIN"); }
  };
  var notMe=document.getElementById("notMeBtn");
  if(notMe) notMe.onclick=function(){
    if(confirm("Switch officer? Your current logbook (vessel, tanks, entries) will be saved under your name, and a new blank logbook will start for the next person.")){
      archiveSessionAndReset();
      STATE.auth={name:"",rank:"",pin:""};
      saveState();
      UI.screen="login";
      render();
    }
  };
}

/* ============================================================
   APP TOUR — a short, reopenable walkthrough of how to navigate
   the app. Shown automatically the first time someone reaches the
   main screen; reopenable anytime from the "?" button in the
   topbar or the "Replay app tour" link in About.
   ============================================================ */
var TOUR_SLIDES = [
  { icon:"anchor", title:"Welcome to e-ORB", body:"This is a "+"training & practice tool"+" for the MARPOL Oil Record Book \u2014 it is "+"not"+" a statutory record book. Here\u2019s a 60-second look at how everything fits together." },
  { icon:"entry", title:"Getting around", body:"Five tabs sit along the bottom: <b>New Entry</b> (log an operation), <b>Register</b> (the tabulated ORB you\u2019ve built so far), <b>Sign</b> (formally sign off entries), <b>Vessel</b> (particulars), and <b>Tank</b> (tank list). The small <b>About</b> button is top-right." },
  { icon:"vessel", title:"Start here: Vessel Particulars", body:"Before logging anything, go to the <b>Vessel</b> tab and fill up <b>all the required Vessel Particulars fields</b> first \u2014 then tap <b>Save vessel particulars</b>. Don\u2019t forget to save it! Only after that should you open the <b>Tank</b> tab to add your tanks, and only then move on to New Entry, Register, or Sign." },
  { icon:"register", title:"Record sections", body:"Every entry belongs to a section, chosen with the chips at the top of New Entry:<br>\u2022 <b>Part I</b> \u2014 machinery space (bilge, sludge, bunkering) \u2014 every ship uses this.<br>\u2022 <b>Part II</b> \u2014 cargo/ballast operations \u2014 tankers only.<br>\u2022 <b>Part III / Annex VI Records</b> \u2014 ODS, NOx, SOx, VOC, incinerator (MARPOL Annex VI). Part III is a <b>Panama</b> flag-specific section and is filed into Book I or II; for any other flag the same operations sit in a separate <b>Annex VI Records</b> module. Set the Flag State in the Vessel tab." },
  { icon:"entry", title:"Adding an entry safely", body:"Pick a Code, then the specific scenario that matches what happened, then fill in the details. The app "+"won\u2019t let you save"+" a negative quantity or a quantity that would overfill a tank past its recorded capacity \u2014 it\u2019ll tell you exactly what to fix.<br><br>New to a particular Code? Switch on <b>Guided walkthrough</b> at the top of New Entry and it\u2019ll take you through it one step at a time." },
  { icon:"sign", title:"Signing off", body:"An entry isn\u2019t official until it\u2019s signed. Open the <b>Sign</b> tab, review what was recorded, and add the officer\u2019s signature. Entries waiting on a signature show as a red count badge on the Sign tab." },
  { icon:"vessel", title:"Vessel & tanks", body:"Set up the vessel\u2019s particulars once from the <b>Vessel</b> tab, and your tank list from the <b>Tank</b> tab. Tank volumes update automatically as you log transfers, and an entry can never push a tank above its recorded capacity." },
  { icon:"register", title:"Register, export & self-check", body:"The <b>Register</b> tab shows everything in the tabulated ORB format \u2014 filter by Part or Code, and download the whole thing as a Word (.docx) file anytime, fully offline.<br><br>Turn on <b>Assessment mode</b> at the top of Register to have the app flag wrong or worth-double-checking entries for you \u2014 handy for self-study or grading." }
];
function renderTourOverlay(){
  if(!UI.tourStep) return "";
  var i = Math.max(1, Math.min(UI.tourStep, TOUR_SLIDES.length));
  var s = TOUR_SLIDES[i-1];
  var dots = TOUR_SLIDES.map(function(_,idx){ return '<span style="display:inline-block;width:'+(idx+1===i?"16px":"6px")+';height:6px;border-radius:4px;margin:0 3px;background:'+(idx+1===i?"var(--accent)":"var(--border)")+';transition:width .2s;"></span>'; }).join("");
  return '<div class="dlg-back" id="tourBack">'+
    '<div class="dlg" style="text-align:center;">'+
      '<div style="color:var(--accent);margin-bottom:6px;">'+icon(s.icon,34)+'</div>'+
      '<h3>'+esc(s.title)+'</h3>'+
      '<div style="font-size:13px;color:var(--text-dim);line-height:1.55;text-align:left;margin:10px 2px 14px;">'+s.body+'</div>'+
      '<div style="margin-bottom:14px;">'+dots+'</div>'+
      (i===3 && !setupChecklistStatus().vesselDone ? '<button class="btn btn-ok btn-block" id="tourGoVessel" style="margin-bottom:10px;">Go to Vessel tab now</button>' : '')+
      '<div class="dlg-btns">'+
        (i>1? '<button class="btn btn-ghost" id="tourBack2">Back</button>' : '<button class="btn btn-ghost" id="tourSkip">Skip</button>')+
        (i<TOUR_SLIDES.length? '<button class="btn btn-primary" id="tourNext">Next</button>' : '<button class="btn btn-primary" id="tourDone">Got it \u2014 start exploring</button>')+
      '</div>'+
    '</div>'+
  '</div>';
}
function bindTourOverlay(){
  var back=document.getElementById("tourBack");
  if(!back) return;
  var next=document.getElementById("tourNext"); if(next) next.onclick=function(){ UI.tourStep++; render(); };
  var prev=document.getElementById("tourBack2"); if(prev) prev.onclick=function(){ UI.tourStep--; render(); };
  var skip=document.getElementById("tourSkip"); if(skip) skip.onclick=function(){ UI.tourStep=0; if(!setupChecklistStatus().vesselDone){ UI.tab="vessel"; } render(); };
  var done=document.getElementById("tourDone"); if(done) done.onclick=function(){ UI.tourStep=0; if(!setupChecklistStatus().vesselDone){ UI.tab="vessel"; } render(); };
  var goVessel=document.getElementById("tourGoVessel"); if(goVessel) goVessel.onclick=function(){ UI.tourStep=0; UI.tab="vessel"; render(); };
  back.addEventListener("click", function(e){ if(e.target===back){ UI.tourStep=0; render(); } });
}

function render(){
  var app=document.getElementById("app");
  if(UI.screen==="splash"){ app.innerHTML=renderSplashScreen(); return; }
  if(UI.screen==="license"){ app.innerHTML=renderLicenseScreen(); bindLicenseScreen(); return; }
  if(UI.screen==="login"){ app.innerHTML=renderLoginScreen(); bindLoginScreen(); return; }
  if(UI.screen==="lock"){ app.innerHTML=renderLockScreen(); bindLockScreen(); return; }
  var v=STATE.vessel;
  var pendingSigCount = STATE.entries.filter(function(e){return !e.signature;}).length;
  app.innerHTML = ''+
  '<div class="topbar">'+
    '<div class="topbar-row1"><div class="brand"><img src="'+APP_ICON+'" alt="" style="width:22px;height:22px;border-radius:5px;vertical-align:middle;margin-right:6px;">e-ORB<small class="brand-sub">Training &amp; Practice System for Marine Engineers</small></div><div style="font-size:11px;color:var(--text-dim-2);white-space:nowrap;">Version '+APP_VERSION+'</div></div>'+
    '<div class="topbar-row2">'+
      '<div class="vessel-strip" style="flex:1;">'+(v.name? '<b>'+esc(v.name)+'</b>'+(v.imo? ' &middot; IMO '+esc(v.imo):'')+(v.flag? ' &middot; '+esc(v.flag):'') : '<b style="color:var(--warn);">Vessel not set</b> &mdash; see Vessel tab')+(STATE.assessMode? ' &middot; <span class="assess-badge">ASSESSMENT MODE</span>':'')+'</div>'+
      '<div class="btnrow" style="flex-wrap:nowrap;flex-shrink:0;">'+
        '<button class="btn btn-ghost btn-sm" id="tourBtn" title="How to use this app" style="padding:4px 10px;min-height:0;">'+icon("about",13)+' Help</button>'+
        '<button class="btn btn-ghost btn-sm" id="aboutBtn" style="padding:4px 10px;min-height:0;">'+icon("about",13)+' About</button>'+
      '</div>'+
    '</div>'+
  '</div>'+
  '<main id="main">'+renderRoute()+'</main>'+
  '<div class="bottomnav">'+
    '<button class="navbtn'+(UI.tab==="register"?' active':'')+'" data-tab="register">'+icon("register")+'Register</button>'+
    '<button class="navbtn'+(UI.tab==="sign"?' active':'')+'" data-tab="sign" style="position:relative;">'+icon("sign")+'Sign'+(pendingSigCount?'<span style="position:absolute;top:4px;right:calc(50% - 20px);background:var(--warn);color:#1a1200;font-size:9px;font-weight:700;border-radius:8px;padding:0 4px;line-height:14px;min-width:14px;">'+pendingSigCount+'</span>':'')+'</button>'+
    '<button class="navbtn-fab'+(UI.tab==="new"?' active':'')+'" data-tab="new"><span class="fab-circle">'+icon("plus",26)+'</span>New Entry</button>'+
    '<button class="navbtn'+(UI.tab==="vessel"?' active':'')+'" data-tab="vessel">'+icon("vessel")+'Vessel</button>'+
    '<button class="navbtn'+(UI.tab==="tank"?' active':'')+'" data-tab="tank">'+icon("tank")+'Tank</button>'+
  '</div>'+
  '<datalist id="tanklist">'+tankListOptionsHTML()+'</datalist>'+
  (UI.toast? '<div class="toast" id="toastEl">'+esc(UI.toast)+'</div>' : '')+
  renderTourOverlay();
  bindRoute();
  document.querySelectorAll("[data-tab]").forEach(function(b){
    b.onclick=function(){ UI.tab=this.getAttribute("data-tab"); render(); };
  });
  var aboutBtn=document.getElementById("aboutBtn");
  if(aboutBtn) aboutBtn.onclick=function(){ UI.tab="about"; renderMain(); };
  var tourBtn=document.getElementById("tourBtn");
  if(tourBtn) tourBtn.onclick=function(){ UI.tourStep=1; render(); };
  bindTourOverlay();
}
function renderMain(){ document.getElementById("main").innerHTML=renderRoute(); refreshTankList(); bindRoute(); }

/* ---------------- init ---------------- */
STATE = loadState();
UI.screen = "splash";
render();
setTimeout(checkLicenseAndBoot, 3000);

})();
</script>
